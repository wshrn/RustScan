[package]
name = "rustscan"
version = "2.4.1"
authors = ["Autumn <autumn@skerritt.blog>"]
edition = "2018"
description = "Fast port scanner written in Rust"
homepage = "https://github.com/rustscan/rustscan"
repository = "https://github.com/rustscan/rustscan"
license = "GPL-3.0-only"
keywords = ["port", "scanning", "network"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [
    ".github/*",
    "pictures/*",
    "rustscan-debbuilder/*",
]

[dependencies]
clap = { version = "4.5.48", features = ["derive", "wrap_help"] }
colored = "3.0.0"
async-std = "1.13.2"
futures = "0.3"
rlimit = "0.10.2"
log = "0.4.28"
env_logger = "0.11.8"
anstream = "=0.6.20"
gcd = "2.0.1"
rand = "0.9.2"
colorful = "0.3.2"
ansi_term = "0.12.1"
cidr-utils = "0.6.1"
itertools = "0.14.0"
hickory-resolver = { version = "0.24.3", features = ["dns-over-rustls"] }
once_cell = "1.21.3"
reqwest = { version = "0.12.8", default-features = false, features = ["blocking", "rustls-tls"] }
rayon = "1.10.0"
native-tls = "0.2.14"
encoding_rs = "0.8.34"
regex = "1.11.1"
indicatif = "0.17.9"
console = "0.15.11"

[dev-dependencies]
wait-timeout = "0.2"
criterion = { version = "0.7", features = ["html_reports"] }

[package.metadata.deb]
depends = "$auto"
section = "rust"

[profile.release]
lto = true
panic = 'abort'
strip = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "rustscan"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }

[[bench]]
name = "benchmark_portscan"
harness = false
