[package]
name = "rustscan-gui"
version = "0.1.0"
edition = "2021"
description = "GUI shell for RustScan using Tauri"
license = "GPL-3.0-only"
authors = ["RustScan Maintainers"]
build = "build.rs"

[build-dependencies]
ureq = "2.10.0"

tauri-build = { version = "1" }

[dependencies]
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1", features = ["window-all", "path-all", "shell-open", "dialog-confirm", "dialog-message", "protocol-asset"] }
aes-gcm = "0.10"
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
thiserror = "1.0"
get_if_addrs = "0.5"
machine-uid = "0.5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
hostname = "0.3"
winreg = { version = "0.52", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
