[package]
name = "rustscan-desktop"
version = "0.1.0"
authors = ["RustScan Team"]
edition = "2021"

[build-dependencies]
ureq = { version = "2.9", features = ["tls"] }
tauri-build = { version = "2.0" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
once_cell = "1.19"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde", "std"] }
rand = "0.8"
rsa = { version = "0.9", default-features = false, features = ["alloc", "pkcs8", "std"] }
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["aes"] }
thiserror = "1.0"
tauri-plugin-opener = { version = "2.0" }
tauri = { version = "2.1", features = ["macros", "config-json"] }
tokio = { version = "1.41", features = ["full"] }
get_if_addrs = "0.5"
machine-uid = "0.5"
hostname = "0.3"
uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
